[package]
name = "ziptool-gui"
version = "0.4.2"
edition = "2024"

[[bin]]
name = "zipo-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui-phosphor = "0.14.0"
egui_extras = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
encoding_rs = "0.8"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
zeroize = "1.9.1"
ziptool-core = { version = "0.4.2", path = "../ziptool-core" }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading"] }
drag = "2.1.1"
winreg = "0.56.0"

[build-dependencies]
embed-resource = "3.0.12"
