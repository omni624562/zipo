[package]
name = "ziptool-gui"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "zipo-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui-phosphor = "0.14.0"
egui_extras = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17.2"
zeroize = "1.9.1"
ziptool-core = { version = "0.2.1", path = "../ziptool-core" }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[build-dependencies]
embed-resource = "3.0.12"
