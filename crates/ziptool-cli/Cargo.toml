[package]
name = "ziptool"
version = "0.4.10"
edition = "2024"

[[bin]]
name = "zipo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
indicatif = "0.18.6"
rpassword = "7.5.4"
ziptool-core = { version = "0.4.10", path = "../ziptool-core" }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
