[package]
name = "ziptool-core"
version = "0.4.10"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
crc32fast = "1.5"
encoding_rs = "0.8.42"
flate2 = "1.1.10"
fs4 = "1.1.0"
hadris-iso = "2.5"
md-5 = "0.11"
sevenz-rust2 = { version = "0.23.0", features = ["aes256", "compress"] }
sha1 = "0.11"
sha2 = "0.11"
tar = "0.4.46"
time = { version = "0.3.55", features = ["local-offset"] }
walkdir = "2.5.0"
xz2 = "0.1.7"
zip = { version = "8.6.0", features = ["aes-crypto", "deflate", "bzip2", "zstd", "time"] }
zstd = { version = "0.14.0", features = ["zstdmt"] }

[dev-dependencies]
tar = "0.4.46"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = "8.6.0"
