ShortDescription: An archiver modeled on 7-Zip, with a file manager and a 7z-compatible command line.
Description: |-
  Zipo compresses and extracts ZIP, 7z, TAR (gz, bz2, xz, zst) and single-file formats, and reads ISO images.
  It supports AES-256 encryption, split volumes, archive browsing with preview, and integrates with File Explorer.
  The command line (zipo) uses the same syntax as 7-Zip's 7z.exe.
