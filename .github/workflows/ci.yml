# 每次推送與 Pull Request：在三個平台跑測試與 clippy，並檢查第三方套件的已知漏洞。
# Windows 另外測試 32 位元與 Arm64（原生 Arm 執行器），以及 release 設定下的 clippy；
# 另外截取 GUI 畫面，並檢查 winget 上架檔案。
# 第三方 actions 固定到 commit SHA（後面註明版本），標籤被改指向時不受影響。
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 預設只能讀取儲存庫內容；需要更多權限的工作（audit）個別設定
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.target && format(', {0}', matrix.target) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # 32 位元版：在 64 位元 Windows 上直接執行測試
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-11-arm
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET_ARG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # GUI 在 Linux 需要的系統函式庫
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: 測試
        shell: bash
        run: cargo test --workspace $TARGET_ARG
      - name: clippy（不允許警告）
        shell: bash
        run: cargo clippy --workspace --all-targets $TARGET_ARG -- -D warnings
      # 只在 debug 版編譯的程式碼（截圖工具）不會遮住 release 版的警告
      - name: clippy（release 設定）
        if: runner.os == 'Windows'
        shell: bash
        run: cargo clippy --workspace --all-targets --release $TARGET_ARG -- -D warnings

  audit:
    runs-on: ubuntu-latest
    # 檢查結果要寫回 GitHub（新儲存庫的預設權限是唯讀）
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 截取 GUI 畫面（debug 版的截圖工具），以 artifact 上傳供檢查畫面：gh run download <run-id> -n screenshots
  # 每個畫面都指定語言（執行器的系統語言是英文），中英文介面都會截到
  # 任何一個畫面沒有產生（程式當掉或卡住）時失敗
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: 建置
        run: cargo build -p ziptool-gui -p ziptool
      - name: 截圖
        shell: pwsh
        run: |
          New-Item -ItemType Directory shots | Out-Null
          & target/debug/zipo.exe a sample.zip crates docs -bd | Out-Null
          $cases = @(
            @{ Name = 'folder'; Env = @{ ZIPTOOL_SHOT_OPEN = "$PWD"; ZIPTOOL_SHOT_SELECT = '2'; ZIPTOOL_SHOT_LANG = 'zh' } },
            @{ Name = 'archive'; Env = @{ ZIPTOOL_SHOT_OPEN = "$PWD\sample.zip"; ZIPTOOL_SHOT_LANG = 'en' } },
            @{ Name = 'add-dialog-dark'; Env = @{ ZIPTOOL_SHOT_OPEN = "$PWD"; ZIPTOOL_SHOT_SELECT = '2'; ZIPTOOL_SHOT_DIALOG = 'add'; ZIPTOOL_SHOT_DARK = '1'; ZIPTOOL_SHOT_LANG = 'zh' } },
            @{ Name = 'extract-dialog-en'; Env = @{ ZIPTOOL_SHOT_OPEN = "$PWD\sample.zip"; ZIPTOOL_SHOT_DIALOG = 'extract'; ZIPTOOL_SHOT_LANG = 'en' } }
          )
          $failed = 0
          foreach ($c in $cases) {
            $env:ZIPTOOL_SHOT = "$PWD\shots\$($c.Name).png"
            foreach ($k in 'ZIPTOOL_SHOT_OPEN', 'ZIPTOOL_SHOT_SELECT', 'ZIPTOOL_SHOT_DIALOG', 'ZIPTOOL_SHOT_DARK', 'ZIPTOOL_SHOT_LANG') { Remove-Item "Env:$k" -ErrorAction SilentlyContinue }
            foreach ($k in $c.Env.Keys) { Set-Item "Env:$k" $c.Env[$k] }
            $p = Start-Process target/debug/zipo-gui.exe -PassThru -RedirectStandardError "shots\$($c.Name).log"
            if (-not $p.WaitForExit(90000)) { $p.Kill(); "逾時：$($c.Name)" }
            if (Test-Path $env:ZIPTOOL_SHOT) { "完成：$($c.Name)" } else { "沒有產生截圖：$($c.Name)"; $failed++ }
          }
          exit $failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: shots/

  # 最新版本的 winget 上架檔案（packaging/winget）格式正確
  winget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: winget validate
        shell: pwsh
        run: |
          $dir = Get-ChildItem packaging/winget/manifests/o/omni624562/Zipo -Directory | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "檢查 $($dir.Name)"
          winget --version
          winget validate --manifest $dir.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
