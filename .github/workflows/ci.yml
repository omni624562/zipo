# 每次推送與 Pull Request：在三個平台跑測試與 clippy，並檢查第三方套件的已知漏洞。
# 第三方 actions 固定到 commit SHA（後面註明版本），標籤被改指向時不受影響。
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 預設只能讀取儲存庫內容；需要更多權限的工作（audit）個別設定
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # GUI 在 Linux 需要的系統函式庫
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - name: 測試
        run: cargo test --workspace
      - name: clippy（不允許警告）
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    # 檢查結果要寫回 GitHub（新儲存庫的預設權限是唯讀）
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
